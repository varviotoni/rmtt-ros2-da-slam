ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_stabilized
    world_frame: odom
    odom0: /odom_raw
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # Set vyaw (index 11) to false: /odom_raw only provides yaw (index 5), not angular velocity.
    # Disabling vyaw allows EKF to differentiate yaw smoothly without fighting a static 0.0 value.
    odom0_config: [false, false, false,
                   false, false, true,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
